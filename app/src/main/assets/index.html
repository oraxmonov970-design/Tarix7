    guide: `1-MAVZU. AJDODLARIMIZNING MA'NAVIY QADRIYATLARI — JAHON SIVILIZATSIYASI ASOSLARIDAN BIRI

1. O'rta asrlar tushunchasi
«O'rta asrlar» tushunchasini tarix faniga italyan tarixchilari olib kirgan. Bu tushuncha xususiy mulkchilik shaklining o'zgarishi bilan bog'liq.
Sharq mamlakatlarida yer-mulk munosabatlari qadimdan jamoaviy asosda rivojlangan. Shu sababli «o'rta asrlar» tushunchasi Turon tarixida shartli ravishda qo'llanadi.

2. Yevropa va Turon tarixida o'rta asrlarning boshlanishi
Yevropada o'rta asrlarning boshlanishi Rim imperiyasining qulashi bilan bog'liq. Bu voqea 476-yil, V asr oxirlariga to'g'ri keladi.
Turon tarixida esa o'rta asrlar IV asr oxirlari va V asr o'rtalaridan, siyosiy maydonda kidariylar, xioniylar va eftaliylar kabi qabila uyushmalari paydo bo'lgan davrdan boshlanadi.

3. O'rta asrlarning bosqichlari
O'rta asrlar uch bosqichga bo'linadi:
- ilk o'rta asrlar
- rivojlangan o'rta asrlar
- so'nggi o'rta asrlar
Bu davrlarda Xorazm, xioniylar, kidariylar, eftaliylar, Turk xoqonligi, Somoniylar, Qoraxoniylar, Xorazmshohlar, Amir Temur va temuriylar kabi davlat va siyosiy tuzilmalar mavjud bo'lgan.

4. Ilk o'rta asrlardagi ijtimoiy o'zgarishlar
Ilk o'rta asrlarda «qishloq hokimlari» deb atalgan katta yer egalari — dehqonlar shakllandi.
Ularning ekinzorlarida ishlovchi yersiz aholi kadivarlar deb atalgan.
Shunday qilib:
- dehqon → katta yer egasi, «qishloq hokimi»
- kadivar → katta yer egalarining ekinzorlarida ishlovchi yersiz aholi
Yerda ishlash tartiblarining tubdan o'zgarishi natijasida aholi o'rtasidagi tabaqalanish yanada keskinlashdi.

VIII asr boshlarida mamlakatimiz hududida Arab xalifaligi hukmronligi o'rnatildi.

Yurtimiz qadimdan Turon deb atalgan.

XVIII–XIX asrlarda g'arb olimlari va sayyohlari tomonidan bu hududlar O'rta Osiyo yoki Markaziy Osiyo deb nomlangan.
Eslab qolish uchun: Turon → Movarounnahr va Xuroson → O'rta Osiyo / Markaziy Osiyo

7. IX–XII asrlar ilm-ma'rifati
Yurtimizdan jahon ilm-fani va ma'naviy hayotiga katta hissa qo'shgan buyuk allomalar yetishib chiqqan.
Ilm-fanga oid mashhur allomalar: Muhammad ibn Muso Xorazmiy, Ahmad Farg'oniy, Abu Rayhon Beruniy, Abu Ali ibn Sino.
Islom dini va ta'limotiga oid asarlar yaratgan mashhur ulamolar: Imom Buxoriy, Imom Termiziy, Mahmud Zamahshariy, Ahmad Yassaviy, Najmiddin Kubro.

8. O'zbek xalqining shakllanishi
O'rta asrlar tarixida «o'zbiy» va «o'zbek» atamalari bilan ulug'langan o'zbek xalqi shakllanganligi haqida ma'lumotlar mavjud.

1. Xo'jalikda nima o'zgardi?
Qishloq xo'jaligida suvdan foydalanish imkoniyatlari kengaydi: suv tegirmoni, chig'ir, charxpalak.
Suv inshootlari → qishloq xo'jaligi rivoji → yerning ahamiyati ortishi → katta yer egaligi.
Diqqat: suv tegirmoni/chig'ir/charxpalak har doim qishloq xo'jaligi bilan bog'lanadi (savdo, harbiy ish yoki hunarmandchilik bilan emas).

2. To'rt asosiy tushuncha
DEHQON — qishloq hokimi va mulkdor tabaqa vakili (hokimiyat + mulk + xo'jalik). Shaharda ham mulki bo'lgan.
KASHOVARZ — erkin ziroatchi, oddiy qo'shchi; yer va suvdan qishloq jamoasi bilan birga umumiy mulk sifatida foydalangan.
KADIVAR — erkinlikdan ayrilgan aholi; o'z yeri va erkinligidan ayrilib, dehqon yerida ishlagan qaram aholi.
CHOKAR — dehqonning harbiy tayanchi; tashqi xavfdan himoya va ichki tartibni ta'minlagan.

Eslab qolish: DEHQON — BOSHQARADI, KASHOVARZ — ERKIN, KADIVAR — QARAM, CHOKAR — QO'RIQLAYDI.

3. Shaharlar nima uchun muhim?
Shaharlar uch yo'nalish bilan bog'langan: HUNAR, SAVDO, MADANIYAT.

4. So'nggi antik davr (milodiy II–IV asrlar)
Bu davrda O'rta Osiyoning dehqonchilik viloyatlarida (Sug'diyona, Marg'iyona, Toxariston, Xorazm, Choch, Farg'ona) tub o'zgarishlar tezlashgan: ko'plab mahalliy hokimliklar tashkil topgan, so'ng ular yiriklashgan.

5. Testda ko'p chalkashadigan joylar
- Dehqon ≠ oddiy ziroatchi (u — hokim, mulkdor).
- Kashovarz (erkin) ≠ Kadivar (qaram) — ikkalasi ham ziroatchilik bilan bog'liq, lekin farqlanadi.
- Kadivar (mehnat qiluvchi qaram aholi) ≠ Chokar (harbiy posbon).
- Suv inshootlari → qishloq xo'jaligi (shaharga emas).

Yakuniy formula:
DEHQON = HOKIM
KASHOVARZ = ERKIN
KADIVAR = QARAM
CHOKAR = HARBIY

    guide: `3-4-MAVZULAR. IV–VII ASRLARDA XORAZM

1. Amudaryo va tabiiy sharoit
Amudaryo Hindiqushning shimoliy yonbag'irlaridagi muzliklardan boshlanadi, Surxon qo'shiladi, so'ng jazirama sahrolar orqali oqib Xorazmni suv bilan ta'minlaydi.
Bog'lanish: Amudaryo → suv → sug'orma dehqonchilik va baliqchilik → Xorazm xo'jaligi.
Xorazm atrofida Qoraqum cho'li joylashgan; xorazmliklar qadimdan qumliklar orqali yo'llar barpo etgan.

2. Xo'jalik tarmoqlari
Sug'orma dehqonchilik, hunarmandchilik, chorvachilik, savdo, baliqchilik — bir nechta soha birgalikda rivojlangan. Qovun, qovoq, yovvoyi jiyda, tut ham muhim o'rin tutgan.

3. Hunarmandchilik, fan va san'at
Sopol buyumlar saroylarni bezagan. Tuproqqal'a saroylarida rangdor tasvirlar, ganchkor naqshlar va haykallar — san'at va haykaltaroshlik rivojlanganini ko'rsatadi.
Xuroson va Eron bilan madaniy-savdo aloqalari bo'lgan.

4. Tuproqqal'a — mustahkam poytaxt
Shahar devori, darvozaxona, markaziy ko'cha, ibodatxona majmuasi, ko'p minorali Xorazmshoh saroyi (balandligi 25 metr) — shahar maydoni 25 gektar.
Adashtirmang: 25 metr = saroy balandligi, 25 gektar = shahar maydoni.
Boshqa mustahkam shahar va qal'ali qishloqlar ham bo'lgan — mudofaaga katta e'tibor.

5. Siyosiy holat: Qang'dan Afrig'iylargacha
Xorazm zaiflashgan Qang' davlatidan ajralib chiqqan, mahalliy Afrig'iylar (Xorazmshohlar) boshqargan — III–X asrlar, asoschisi Afrig'.
Hukmdorlik ramzlari: burgut va lochin.

6. 305-yil: Afrig', Kat, Alfir
305-yilda Afrig' qarorgohini Katga ko'chirdi → Kat qayta tiklandi → Alfir qal'asi yonida yangi saroy qurildi.
Ketma-ketlik: Qang'dan ajralish → Afrig' Katga ko'chishi → Kat tiklanishi → Alfirda yangi saroy.

7. Kumush tangalar va savdo mustaqilligi
Afrig'iy hukmdorlar kumush tanga zarb ettirgan (old tomonda hukmdor, orqasida otliq chavandoz).
Bog'lanish: Qang'dan ajralish → Afrig'iylar hukmronligi → kumush tangalar → savdo mustaqilligi.

8. Xubbi haqidagi afsona
Xubbi — suv ilohi va homiysi; baliq tutadi, cho'kayotganlarni qutqaradi. Jamshid taxtga chiqqach g'oyib bo'ladi; onasi Amudaryoni izlab yig'laydi, shundan keyin onasining haykali qayiqlar tumshug'iga o'rnatilgan.
Bog'lanish: suv → muqaddas tushuncha → Xubbi → suv homiysi.

Yakuniy formula:
Amudaryo → xo'jalik
Tuproqqal'a → shahar va mudofaa
Qang'dan ajralish → siyosiy o'zgarish
Afrig' → 305-yil → Kat → Alfir
Kumush tanga → savdo mustaqilligi
Xubbi → suv → muqaddaslik

Muallif: O. Raxmonov`,

        right:["Katning qayta tiklanishi va yangi saroy qurilishi","Xorazmning mahalliy Afrig'iylar tomonidan boshqarilishi","Ichki va tashqi savdoda mustaqillik","Xubbining onasi bilan bog'liq voqealar va qayiq burnidagi haykal an'anasi"],

      { q:"Amudaryoning oqimi bilan bog'liq quyidagi jarayonlarni tabiiy ketma-ketlikda joylashtiring:", type:"order",

      { q:"Afrig'iylar Xorazmning ichki va tashqi savdo munosabatlaridagi mustaqilligini ko'rsatuvchi qanday tangalar zarb etgan?", type:"fill", answers:["kumush","kumush tangalar"] },
      { q:"Milodiy 305-yilda Afrig' o'z qarorgohini qaysi shaharga ko'chirdi?", type:"fill", answers:["kat"] },
      { q:"Xorazm davlatining dastlabki poytaxti hozirgi Ellikqal'a tumanidagi qadimgi qaysi shahar xarobasi o'rnida bo'lgan?", type:"fill", answers:["tuproqqal'a","tuproqqala","tuproq qal'a"] },
      { q:"Xorazmda III–X asrlarda hukmronlik qilgan sulola qanday atalgan?", type:"fill", answers:["afrig'iylar","afrigiylar"] },
      { q:"Xorazm diniy qarashlarida nima muqaddas hisoblangan?", type:"fill", answers:["suv"] },
      { q:"Xorazm hukmronligining ramzlari qaysi ikki qush bo'lgan?", type:"fill", answers:["burgut va lochin","burgut, lochin","lochin va burgut"] },
      { q:"Amudaryoning Xorazmni suv bilan ta'minlashi vohaning sug'orma dehqonchiligi rivojlanganligi bilan mazmunan bog'liq.", type:"tf", correct:true },
      { q:"Xorazmliklarning Qoraqum qumliklaridan yo'l o'tkazgani ularning tabiiy to'siqlardan butunlay chetlashganini ko'rsatadi.", type:"tf", correct:false },
      { q:"Tuproqqal'adagi mustahkam devor, darvozaxona va ko'p minorali qasr uning mudofaa ahamiyatini ko'rsatadi.", type:"tf", correct:true },
      { q:"Tuproqqal'a qasrining rangdor tasvirlar, ganchkor naqshlar va haykallar bilan bezatilishi Xorazmda san'at va haykaltaroshlik rivojlanganligi bilan mos keladi.", type:"tf", correct:true },
      { q:"Afrig'ning Katga ko'chishi bilan Kat qayta tiklangan va Alfir qasri yonida yangi saroy qurilgan.", type:"tf", correct:true },
      { q:"Afrig'iylarning kumush tangalar zarb etishi Xorazmning ichki va tashqi savdo munosabatlaridagi mustaqilligi bilan bog'langan.", type:"tf", correct:true },
      { q:"Xorazmning Qang' davlatidan ajralib chiqishi va Afrig'iylar hukmronligi o'rtasida hech qanday bog'liqlik bo'lmagan.", type:"tf", correct:false },
      { q:"Xubbi haqidagi afsona Xorazmda suvning xo'jalikdan tashqari diniy qarashlarda ham muhim o'rin tutganini ko'rsatadi.", type:"tf", correct:true },
      { q:"Xubbining g'oyib bo'lishi haqidagi afsona bilan bog'liq holda uning onasining haykali qayiqlarning burniga o'rnatilgani aytiladi.", type:"tf", correct:true },
      { q:"Xorazmning Xuroson va Eron bilan aloqalari faqat savdo munosabatlaridan iborat bo'lgan.", type:"tf", correct:false }
    ]
       }
];

let state = {
  screen: 'menu',
  currentTopic: null,
  quizQuestions: [],
  quizIndex: 0,
  score: 0,
  selectedIds: []
};

const STORAGE_KEY = 'tarix7_progress';

function saveProgress(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      lastScreen: state.screen
    }));
  }catch(e){}
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function prepareQuiz(rawQuestions){
  const shuffledQ = shuffle(rawQuestions);
  return shuffledQ.map(item=>{
    if(item.type === 'match'){
      const rightIndices = shuffle(item.right.map((_,i)=>i));
      const newRight = rightIndices.map(i=>item.right[i]);
      const newCorrect = item.correct.map(ci => rightIndices.indexOf(ci));
      return { q:item.q, left:item.left, right:newRight, correct:newCorrect, type:'match' };
    }
    if(item.type === 'order'){
      const indices = shuffle(item.items.map((_,i)=>i));
      const shuffledItems = indices.map(i=>item.items[i]);
      return { q:item.q, items:shuffledItems, indices:indices, type:'order' };
    }
    if(item.type === 'tf'){
      return { q:item.q, correct: item.correct, type:'tf' };
    }
    if(item.type === 'fill'){
      return { q:item.q, answers: item.answers, type:'fill' };
    }
    const optIndices = shuffle(item.opts.map((_,i)=>i));
    const newOpts = optIndices.map(i=>item.opts[i]);
    let newCorrect;
    if(Array.isArray(item.correct)){
      newCorrect = item.correct.map(ci => optIndices.indexOf(ci)).sort((a,b)=>a-b);
    } else {
      newCorrect = optIndices.indexOf(item.correct);
    }
    return { q:item.q, opts:newOpts, correct:newCorrect, type: item.type || 'single' };
  });
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';

  if(state.screen === 'menu') renderMenu(app);
  else if(state.screen === 'guide') renderGuide(app);
  else if(state.screen === 'test') renderTest(app);
  else if(state.screen === 'select') renderSelect(app);
  else if(state.screen === 'result') renderResult(app);

  saveProgress();
}

function renderMenu(app){
  const wrap = document.createElement('div');

  const selectCard = document.createElement('div');
  selectCard.className = 'card';
  selectCard.innerHTML = `<b>Mavzu tanlab test</b><br><span style="color:var(--muted);font-size:13px;">Bir nechta mavzudan aralash test</span>`;
  selectCard.style.cursor = 'pointer';
  selectCard.onclick = ()=>{ state.screen='select'; state.selectedIds=[]; render(); };
  wrap.appendChild(selectCard);

  if(BUILTIN_TOPICS.length === 0){
    const empty = document.createElement('div');
    empty.className = 'card';
    empty.innerHTML = `<span style="color:var(--muted);">Hozircha mavzular qo'shilmagan.</span>`;
    wrap.appendChild(empty);
  }

  BUILTIN_TOPICS.forEach(topic=>{
    const el = document.createElement('div');
    el.className = 'card topic-item';
    el.innerHTML = `<div><b>${topic.title}</b><br><span class="region">${topic.region==='vatan'?'Vatan tarixi':'Jahon tarixi'}</span></div><div>›</div>`;
    el.onclick = ()=>{ state.currentTopic = topic; state.screen='guide'; render(); };
    wrap.appendChild(el);
  });

  app.appendChild(wrap);
}

function renderGuide(app){
  const t = state.currentTopic;
  const back = document.createElement('a');
  back.className='back'; back.href='#'; back.textContent='‹ Orqaga';
  back.onclick=(e)=>{e.preventDefault(); state.screen='menu'; render();};
  app.appendChild(back);

  const card = document.createElement('div');
  card.className='card';
  card.innerHTML = `<h2 style="margin-top:0;font-size:17px;">${t.title}</h2><div class="guide-text">${t.guide}</div>`;
  app.appendChild(card);

  const startBtn = document.createElement('button');
  startBtn.textContent = 'Testni boshlash';
  startBtn.onclick = ()=>{
    state.quizQuestions = prepareQuiz(t.questions);
    state.quizIndex = 0;
    state.score = 0;
    state.screen = 'test';
    render();
  };
  app.appendChild(startBtn);
}

function renderTest(app){
  const q = state.quizQuestions[state.quizIndex];
  if(!q){ state.screen='result'; render(); return; }

  const progress = document.createElement('div');
  progress.className='progress';
  progress.textContent = `Savol ${state.quizIndex+1} / ${state.quizQuestions.length}`;
  app.appendChild(progress);

  const card = document.createElement('div');
  card.className='card';
  const qText = document.createElement('div');
  qText.style.fontSize='16px'; qText.style.marginBottom='12px'; qText.style.fontWeight='600';
  qText.textContent = q.q + (q.type === 'multi' ? " (bir nechta javob to'g'ri)" : q.type === 'match' ? " (mos juftlarni bog'lang)" : q.type === 'order' ? " (tartib bilan bosing)" : '');
  card.appendChild(qText);

  let answered = false;
  const nextBtn = document.createElement('button');
  nextBtn.textContent = (state.quizIndex+1 < state.quizQuestions.length) ? 'Keyingisi' : 'Yakunlash';
  nextBtn.className = 'hidden';
  nextBtn.onclick = ()=>{
    state.quizIndex++;
    render();
  };

  if(q.type === 'multi'){
    const selected = new Set();
    const optionEls = [];
    q.opts.forEach((opt,idx)=>{
      const b = document.createElement('button');
      b.className='opt-btn';
      b.textContent = '\u2610 ' + opt;
      b.onclick = ()=>{
        if(answered) return;
        if(selected.has(idx)){
          selected.delete(idx);
          b.textContent = '\u2610 ' + opt;
        }else{
          selected.add(idx);
          b.textContent = '\u2611 ' + opt;
        }
      };
      optionEls.push(b);
      card.appendChild(b);
    });
    app.appendChild(card);

    const checkBtn = document.createElement('button');
    checkBtn.textContent = 'Javobni tekshirish';
    checkBtn.onclick = ()=>{
      if(answered) return;
      answered = true;
      const selArr = Array.from(selected).sort((a,b)=>a-b);
      const isCorrect = selArr.length === q.correct.length && selArr.every((v,i)=>v===q.correct[i]);
      optionEls.forEach((bb,i)=>{
        bb.disabled = true;
        if(q.correct.includes(i)) bb.classList.add('correct');
        else if(selected.has(i)) bb.classList.add('wrong');
      });
      if(isCorrect) state.score++;
      checkBtn.classList.add('hidden');
      nextBtn.classList.remove('hidden');
    };
    app.appendChild(checkBtn);
  } else if(q.type === 'match'){
    const wrap = document.createElement('div');
    wrap.style.display = 'flex';
    wrap.style.gap = '10px';
    const leftCol = document.createElement('div');
    leftCol.style.flex = '1';
    const rightCol = document.createElement('div');
    rightCol.style.flex = '1';

    let selectedLeft = null;
    const pairs = {};
    const leftBtns = [];
    const rightBtns = [];

    function refreshLabels(){
      q.left.forEach((txt,i)=>{
        const paired = pairs.hasOwnProperty(i);
        leftBtns[i].textContent = (i+1) + ') ' + txt + (paired ? '  \u2192 ' + String.fromCharCode(65+pairs[i]) : '');
        leftBtns[i].style.outline = (selectedLeft === i) ? '2px solid #38bdf8' : 'none';
      });
      q.right.forEach((txt,j)=>{
        const usedBy = Object.keys(pairs).find(k=>pairs[k]===j);
        rightBtns[j].textContent = String.fromCharCode(65+j) + ') ' + txt + (usedBy!==undefined ? '  \u2190 ' + (parseInt(usedBy)+1) : '');
      });
    }

    q.left.forEach((txt,i)=>{
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.onclick = ()=>{
        if(answered) return;
        if(pairs.hasOwnProperty(i)){
          delete pairs[i];
          selectedLeft = null;
        } else {
          selectedLeft = (selectedLeft === i) ? null : i;
        }
        refreshLabels();
      };
      leftBtns.push(b);
      leftCol.appendChild(b);
    });

    q.right.forEach((txt,j)=>{
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.onclick = ()=>{
        if(answered) return;
        if(selectedLeft === null) return;
        const usedBy = Object.keys(pairs).find(k=>pairs[k]===j);
        if(usedBy !== undefined) delete pairs[usedBy];
        pairs[selectedLeft] = j;
        selectedLeft = null;
        refreshLabels();
      };
      rightBtns.push(b);
      rightCol.appendChild(b);
    });

    refreshLabels();
    wrap.appendChild(leftCol);
    wrap.appendChild(rightCol);
    card.appendChild(wrap);
    app.appendChild(card);

    const checkBtn2 = document.createElement('button');
    checkBtn2.textContent = 'Javobni tekshirish';
    checkBtn2.onclick = ()=>{
      if(answered) return;
      if(Object.keys(pairs).length < q.left.length) return;
      answered = true;
      let allCorrect = true;
      q.left.forEach((txt,i)=>{
        const isRight = pairs[i] === q.correct[i];
        if(!isRight) allCorrect = false;
        leftBtns[i].disabled = true;
        leftBtns[i].classList.add(isRight ? 'correct' : 'wrong');
      });
      rightBtns.forEach(b=>b.disabled = true);
      if(allCorrect) state.score++;
      checkBtn2.classList.add('hidden');
      nextBtn.classList.remove('hidden');
    };
    app.appendChild(checkBtn2);
  } else if(q.type === 'tf'){
    const opts = ["To'g'ri","Noto'g'ri"];
    opts.forEach((opt,idx)=>{
      const b = document.createElement('button');
      b.className='opt-btn';
      b.textContent = opt;
      b.onclick = ()=>{
        if(answered) return;
        answered = true;
        const chosenTrue = (idx===0);
        const buttons = card.querySelectorAll('.opt-btn');
        buttons.forEach((bb,i)=>{
          bb.disabled = true;
          const bbIsTrue = (i===0);
          if(bbIsTrue === q.correct) bb.classList.add('correct');
          else if(i===idx) bb.classList.add('wrong');
        });
        if(chosenTrue === q.correct) state.score++;
        nextBtn.classList.remove('hidden');
      };
      card.appendChild(b);
    });
    app.appendChild(card);
  } else if(q.type === 'fill'){
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = "Javobingizni yozing...";
    input.style.cssText = 'width:100%;padding:12px;border-radius:8px;border:none;background:#334155;color:var(--text);font-size:14px;margin-bottom:10px;box-sizing:border-box;';
    card.appendChild(input);
    app.appendChild(card);

    const feedback = document.createElement('div');
    feedback.style.marginBottom = '8px';
    feedback.style.fontSize = '14px';

    const checkBtn3 = document.createElement('button');
    checkBtn3.textContent = 'Javobni tekshirish';
    checkBtn3.onclick = ()=>{
      if(answered) return;
      answered = true;
      const userAns = input.value.trim().toLowerCase();
      const isCorrect = q.answers.some(a=>a.trim().toLowerCase()===userAns);
      input.disabled = true;
      feedback.textContent = isCorrect ? '\u2705 To\'g\'ri!' : ('\u274c Noto\'g\'ri. To\'g\'ri javob: ' + q.answers[0]);
      feedback.style.color = isCorrect ? 'var(--accent2)' : 'var(--danger)';
      card.appendChild(feedback);
      if(isCorrect) state.score++;
      checkBtn3.classList.add('hidden');
      nextBtn.classList.remove('hidden');
    };
    app.appendChild(checkBtn3);
  } else if(q.type === 'order'){
    const chosen = [];
    const btns = [];

    function refreshOrderLabels(){
      q.items.forEach((txt,idx)=>{
        const pos = chosen.indexOf(idx);
        btns[idx].textContent = (pos>=0 ? (pos+1)+') ' : '') + txt;
      });
    }

    q.items.forEach((txt,idx)=>{
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = txt;
      b.onclick = ()=>{
        if(answered) return;
        if(chosen.includes(idx)){
          if(chosen[chosen.length-1] === idx){
            chosen.pop();
            refreshOrderLabels();
          }
          return;
        }
        chosen.push(idx);
        refreshOrderLabels();
      };
      btns.push(b);
      card.appendChild(b);
    });
    app.appendChild(card);

    const checkBtn4 = document.createElement('button');
    checkBtn4.textContent = 'Javobni tekshirish';
    checkBtn4.onclick = ()=>{
      if(answered) return;
      if(chosen.length < q.items.length) return;
      answered = true;
      const isCorrect = chosen.every((btnIdx,pos)=> q.indices[btnIdx] === pos);
      btns.forEach((bb,idx)=>{
        bb.disabled = true;
        const pos = chosen.indexOf(idx);
        const isRightPos = q.indices[idx] === pos;
        bb.classList.add(isRightPos ? 'correct' : 'wrong');
      });
      if(isCorrect) state.score++;
      checkBtn4.classList.add('hidden');
      nextBtn.classList.remove('hidden');
    };
    app.appendChild(checkBtn4);
  } else {
    q.opts.forEach((opt,idx)=>{
      const b = document.createElement('button');
      b.className='opt-btn';
      b.textContent = opt;
      b.onclick = ()=>{
        if(answered) return;
        answered = true;
        const buttons = card.querySelectorAll('.opt-btn');
        buttons.forEach((bb,i)=>{
          bb.disabled = true;
          if(i === q.correct) bb.classList.add('correct');
          else if(i === idx) bb.classList.add('wrong');
        });
        if(idx === q.correct) state.score++;
        nextBtn.classList.remove('hidden');
      };
      card.appendChild(b);
    });
    app.appendChild(card);
  }

  app.appendChild(nextBtn);
}

function renderSelect(app){
  const back = document.createElement('a');
  back.className='back'; back.href='#'; back.textContent='‹ Orqaga';
  back.onclick=(e)=>{e.preventDefault(); state.screen='menu'; render();};
  app.appendChild(back);

  const info = document.createElement('div');
  info.className='card';
  info.innerHTML = `<b>Mavzularni tanlang (maks. 5 ta)</b>`;
  app.appendChild(info);

  const list = document.createElement('div');
  list.className='card';
  BUILTIN_TOPICS.forEach(t=>{
    const row = document.createElement('label');
    row.className='checkbox-row';
    const cb = document.createElement('input');
    cb.type='checkbox';
    cb.checked = state.selectedIds.includes(t.id);
    cb.onchange = ()=>{
      if(cb.checked){
        if(state.selectedIds.length>=5){ cb.checked=false; return; }
        state.selectedIds.push(t.id);
      }else{
        state.selectedIds = state.selectedIds.filter(id=>id!==t.id);
      }
    };
    row.appendChild(cb);
    const span = document.createElement('span');
    span.textContent = t.title;
    row.appendChild(span);
    list.appendChild(row);
  });
  app.appendChild(list);

  const startBtn = document.createElement('button');
  startBtn.textContent = 'Tanlangan mavzulardan test boshlash';
  startBtn.onclick = ()=>{
    if(state.selectedIds.length===0) return;
    const pool = [];
    BUILTIN_TOPICS.filter(t=>state.selectedIds.includes(t.id))
      .forEach(t=> pool.push(...t.questions));
    state.quizQuestions = prepareQuiz(pool);
    state.quizIndex = 0;
    state.score = 0;
    state.screen = 'test';
    render();
  };
  app.appendChild(startBtn);
}

function renderResult(app){
  const total = state.quizQuestions.length;
  const pct = total ? Math.round((state.score/total)*100) : 0;
  const box = document.createElement('div');
  box.className = 'card score-box';
  box.innerHTML = `
    <div style="color:var(--muted);">Natija</div>
    <h2>${state.score} / ${total}</h2>
    <div style="color:var(--muted);">${pct}%</div>
  `;
  app.appendChild(box);

  const menuBtn = document.createElement('button');
  menuBtn.textContent = 'Bosh menyuga qaytish';
  menuBtn.onclick = ()=>{ state.screen='menu'; render(); };
  app.appendChild(menuBtn);
}

render();
</script>
